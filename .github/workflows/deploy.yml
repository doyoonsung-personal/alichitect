# Production deploy of https://architect.alikorea-demo.com. Manual only: Actions > Deploy > Run workflow, and type
# "deploy" to confirm. The same steps as apps/worker/scripts/deploy.ps1: preflight, build the web app, test, apply the
# remote D1 migrations, wrangler deploy.
#
# Cloudflare credentials: put them in the "production" ENVIRONMENT (Settings > Environments > production > Environment
# secrets), not in the repository secrets, and restrict that environment to the branches that may deploy and to a required
# reviewer (docs/DEPLOY.md, "Deploy from GitHub"). Anyone with write access can push a branch whose workflow reads
# repository secrets; environment secrets are released only to a job that passes the environment's rules.
#   CLOUDFLARE_API_TOKEN   preferred: an API token limited to this account (Workers Scripts: Edit, D1: Edit, and Workers
#                          Routes / Zone: Edit for alikorea-demo.com). It cannot touch anything else.
#   -- or, only if you cannot make a token --
#   CLOUDFLARE_API_KEY     the Cloudflare global API key (full access to the account and the zone: avoid)
#   CLOUDFLARE_EMAIL       the email of that Cloudflare login
#   CLOUDFLARE_ACCOUNT_ID  cfd2a327acfb7d93dc045825f12dd38d
# Define one set. Wrangler uses the key and email when both are present, and the token otherwise.
# The Worker's own secrets (DASHSCOPE_API_KEY, SESSION_SECRET) are not here: they live on the Worker, set once with
# apps/worker/scripts/set-secrets.ps1, and survive every deploy.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy to https://architect.alikorea-demo.com'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # the branch check is a convenience; the environment's deployment-branch rule is the control
    if: ${{ github.event.inputs.confirm == 'deploy' && (github.ref_name == 'main' || github.ref_name == 'phase-1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://architect.alikorea-demo.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/worker/package-lock.json
            packages/core/package-lock.json

      - name: "Install (packages/core: the Anthropic SDK, bundled into the Worker)"
        working-directory: packages/core
        run: npm ci --no-audit --no-fund
      - name: Install (worker)
        working-directory: apps/worker
        run: npm ci --no-audit --no-fund
      - name: Preflight (no placeholder or local-only switch left in wrangler.jsonc)
        working-directory: apps/worker
        run: npm run preflight

      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Test the Worker
        working-directory: apps/worker
        run: |
          npm run typecheck
          npm test

      - name: Apply D1 migrations, then deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          # A scoped API token (preferred), or the global key and its email; define one set (see the header).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          WRANGLER_SEND_METRICS: 'false'
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          wranglerVersion: '4.156.0'
          command: |
            d1 migrations apply alichitect --remote --env=
            deploy --env=

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://architect.alikorea-demo.com/api/health | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "health check failed" >&2
          exit 1
